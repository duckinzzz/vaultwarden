services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # Домен обязателен: Vaultwarden проверяет по нему origin запросов.
      DOMAIN: "https://${VW_DOMAIN}"
    volumes:
      - ./vw-data/:/data/
    networks:
      - caddy-proxy
    labels:
      caddy: ${VW_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

networks:
  caddy-proxy:
    external: true
